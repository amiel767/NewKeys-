name: Build & Upload Debug APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Publish to build-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Environment Files & Keystore
        run: |
          touch .env
          touch .env.example
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          export GRADLE_OPTS="-Djava.awt.headless=true -Xmx4096m"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true
          else
            gradle assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true
          fi

      - name: Locate Debug APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find .build-outputs/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No APK generated"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK to build-artifacts branch
        if: steps.find_apk.outputs.apk_path != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APK_SOURCE="${{ steps.find_apk.outputs.apk_path }}"
          APK_NAME="app-debug-${{ github.run_number }}.apk"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep only the latest 5 APKs for compactness
          git fetch origin build-artifacts || true
          git checkout -B build-artifacts

          mkdir -p apk
          if [ -d "apk" ]; then
            ls -t apk/*.apk 2>/dev/null | tail -n +6 | xargs -r rm -f
          fi

          cp "$APK_SOURCE" "apk/$APK_NAME"

          git add -A apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "Upload debug APK for run #${{ github.run_number }}"
            git push origin HEAD:build-artifacts --force-with-lease
          fi

          echo "APK published to branch build-artifacts: apk/$APK_NAME"
